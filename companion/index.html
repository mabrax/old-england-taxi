nce, bounded acquisition and the compiler/runtime separation. Hosted generation remains a separate decision.","kind":"Guardrail","source":"plans/driveability/README.md"},{"title":"Keep phases lean","summary":"Detail each phase when ready.","detail":"The roadmap is living. Discuss implementation at the next phase boundary; promote necessary backbone work explicitly and remove duplicated scope.","kind":"Working agreement","source":"plans/zone-compiler/README.md"}],"milestones":[{"title":"A reproducible world","text":"Immutable OSM, roads, buildings and a street graph.","status":"Delivered","state":"complete","stage":"01"},{"title":"Build somewhere new","text":"Place search, local generation and connection recovery.","status":"Delivered","state":"complete","stage":"02"},{"title":"A vehicle to drive","text":"Real physics, collision, chase view and recovery.","status":"Reviewed","state":"reviewed","stage":"03"},{"title":"A repeatable benchmark","text":"Chicago control tape and a verified desktop trace.","status":"Reviewed","state":"reviewed","stage":"03"}],"evidence":[{"title":"Roadmap & current direction","path":"plans/README.md","note":"Source of stage ordering, desktop priority and deferred GC work."},{"title":"Driveability acceptance","path":"plans/driveability/phase-04-verification.md","note":"Historical passes, failures, indeterminate results and open gates."},{"title":"Desktop benchmark review","path":"plans/driveability/desktop-benchmark/verification.md","note":"One displayed Chrome/NVIDIA observation; corrected parser and immutable evidence."}],"handoffs":[{"date":"8 Sep","title":"GC investigation deferred","detail":"Tracked in issue #1 alongside next-phase planning.","reference":"179814c"},{"date":"8 Sep","title":"Benchmark reviewed","detail":"Saved trace validated; final-span rounding bounded to 1 µs.","reference":"84cedae"},{"date":"7 Sep","title":"Driveability handed back","detail":"Implementation reviewed; full stage acceptance remains open.","reference":"e <script>
(() => {
  'use strict';
  const data=JSON.parse(document.getElementById('project-data').textContent);
  const $=id=>document.getElementById(id);
  const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;};
  const badge=(text,state)=>el('span',`badge ${state}`,text);
  const date=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(`${data.synced}T12:00:00Z`));
  $('project-name').textContent=data.project;document.title=`${data.project} · Champion companion`;
  $('sync').append(el('div','',`Synced ${date}`),el('div','',data.syncNote));
  $('headline').textContent=data.headline;$('summary').textContent=data.summary;
  const current=data.stages.find(stage=>stage.id===data.currentStage);
  $('current-stage-label').textContent=`Current stage · ${current.id} / ${current.title}`;
  $('gates-heading').textContent=data.gatesHeading;
  $('integration-heading').textContent=data.integration.title;$('integration-note').textContent=data.integration.note;
  $('more-decisions-disclosure').hidden=data.decisions.length<=3;
  $('more-decisions-label').textContent=`${Math.max(0,data.decisions.length-3)} more decisions & agreements`;
  $('next-title').textContent=data.next.title;$('next-topics').textContent=data.next.topics.join(' · ');$('next-note').textContent=data.next.note;
  $('footer-note').textContent=`Synced ${date} · Maintained after champion syncs. A project snapshot, not live monitoring.`;
  let selected=data.currentStage;
  function selectStage(id,moveFocus=false){
    const stage=data.stages.find(s=>s.id===id);if(!stage)return;selected=id;
    for(const b of $('stage-list').children)b.setAttribute('aria-pressed',String(b.dataset.stage===id));
    const fragment=document.createDocumentFragment();const top=el('div','panel-header'),titleBlock=el('div');
    titleBlock.append(el('div','eyebrow',`Stage ${stage.id}`));const title=el('h2','stage-heading',stage.title);title.id='stage-title';title.tabIndex=-1;titleBlock.append(title);top.append(titleBlock,badge(stage.status,stage.state));fragment.append(top,el('p','stage-description',stage.summary));
    const track=el('div','delivery-track');['Delivery','Review','Acceptance','Integration'].forEach((label,i)=>{const value=stage.dimensions[i],state=stage.state==='complete'?'complete':stage.state==='open'?(i===0?'complete':i===1?'reviewed':'open'):'planned';const item=el('div',`delivery-item ${state}`);item.append(el('span','caption',label),el('strong','',value));track.append(item);});fragment.append(track);
    const sectionLabel=el('div','section-label');sectionLabel.append(el('span','eyebrow',stage.state==='next'||stage.state==='planned'?'Scope to shape':'Inside this stage'));fragment.append(sectionLabel);
    const phases=el('ol','phase-list');stage.phases.forEach((phase,index)=>{const row=el('li','phase-row');row.append(el('span','phase-index',phase.extension?'+':String(index+1).padStart(2,'0')));if(phase.detail){const toggle=el('button','phase-toggle');toggle.setAttribute('aria-expanded','false');const detailId=`phase-${stage.id}-${index}`;toggle.setAttribute('aria-controls',detailId);toggle.append(el('span','phase-name',phase.title),el('span','chevron','›'));const detail=el('p','phase-detail',phase.detail);detail.id=detailId;detail.hidden=true;toggle.addEventListener('click',()=>{detail.hidden=!detail.hidden;toggle.setAttribute('aria-expanded',String(!detail.hidden));});row.append(toggle,badge(phase.status,phase.state),detail);}else row.append(el('span','phase-name',phase.title),badge(phase.status,phase.state));phases.append(row);});fragment.append(phases);
    const outcome=el('div','stage-outcome');outcome.append(el('strong','',stage.state==='complete'?'Delivered outcome':'Stage goal'),el('span','',stage.outcome));fragment.append(outcome);
    const source=el('div','stage-source'),sourceButton=el('button','',`Source · ${stage.source}`);sourceButton.addEventListener('click',()=>openSources(stage.source));source.append(sourceButton);fragment.append(source);
    $('stage-content').replaceChildren(fragment);$('announcement').textContent=`Stage ${stage.id}: ${stage.title}. ${stage.status}.`;
    if(moveFocus){title.focus({preventScroll:true});$('stage-panel').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});}
  }
  data.stages.forEach(stage=>{const button=el('button',`stage-button ${stage.state}`);button.dataset.stage=stage.id;button.type='button';button.setAttribute('aria-pressed',String(stage.id===selected));button.setAttribute('aria-controls','stage-panel');const label=el('span');label.append(el('span','stage-name',stage.title),el('span','stage-status',stage.status));button.append(el('span','stage-number',stage.id),label);button.addEventListener('click',()=>selectStage(stage.id));$('stage-list').append(button);});
  $('next-stage').addEventListener('click',()=>selectStage(data.nextStage,true));
  data.gates.forEach(gate=>{const detail=el('details');detail.append(el('summary','',gate.title),el('p','',gate.detail));$('gates').append(detail);});
  data.decisions.forEach((decision,index)=>{const detail=el('details','decision'),summary=el('summary'),head=el('div','decision-title');head.append(el('span','',decision.title),el('span','decision-kind',decision.kind));summary.append(head,el('div','decision-summary',decision.summary));const body=el('div','decision-detail',decision.detail);if(decision.href){const p=el('p'),a=el('a','','Open follow-up issue ↗');a.href=decision.href;a.target='_blank';a.rel='noopener noreferrer';p.style.marginTop='8px';p.append(a);body.append(p);}detail.append(summary,body);$(index<3?'decisions':'more-decisions').append(detail);});
  data.milestones.forEach(m=>{const button=el('button',`milestone ${m.state}`);button.type='button';button.append(el('span','milestone-title',m.title),el('span','milestone-text',m.text),badge(m.status,m.state));button.addEventListener('click',()=>selectStage(m.stage,true));$('milestones').append(button);});
  data.handoffs.forEach(h=>{const row=el('div','handoff'),content=el('div');content.append(el('strong','',h.title),el('span','',`${h.detail} · ${h.reference}`));row.append(el('span','',h.date),content);$('handoffs').append(row);});
  function sourceRecord(title,path,note){const record=el('div','source-record'),absolute=`${data.sourceRoot}/${path}`;record.append(el('strong','',title));if(note)record.append(el('p','',note));record.append(el('code','',absolute));const copy=el('button','source-copy','Copy source path');copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(absolute);copy.textContent='Copied';}catch{const range=document.createRange();range.selectNodeContents(record.querySelector('code'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);copy.textContent='Path selected — copy to use';}});record.append(copy);return record;}
  function openSources(path){const content=$('source-content');content.replaceChildren();if(path)content.append(sourceRecord('Selected stage plan',path,''));else data.evidence.forEach(s=>content.append(sourceRecord(s.title,s.path,s.note)));const revisions=el('div','revision-grid');for(const [label,copy] of [['Canonical main',data.canonical],['Reviewed work',data.reviewed]]){const box=el('div');box.append(el('strong','',label),el('code','',`${copy.branch} · ${copy.commit}`),el('p','',copy.label));if(copy.reviewCommit)box.append(el('p','',`Implementation reviewed through ${copy.reviewCommit}. Integration pending.`));revisions.append(box);}content.append(revisions);$('source-dialog').showModal();}
  $('sources-button').addEventListener('click',()=>openSources());$('close-dialog').addEventListener('click',()=>$('source-dialog').close());$('source-dialog').addEventListener('click',event=>{if(event.target===$('source-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();}});
  selectStage(selected);
})();
</script>
</body>
